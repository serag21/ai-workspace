name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:smoke
      - run: npm run build
      - name: Verify extension bundle
        run: test -f dist/manifest.json && test -f dist/background.js && test -f dist/content.js && test -f dist/index.html
      - name: Upload installable extension bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ai-workspace-extension
          path: dist/
          if-no-files-found: error
          retention-days: 30
