name: Local agent spike tests
on:
  push:
    branches:
      - spike/local-agents-desktop
  workflow_dispatch:
jobs:
  local-agent-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test experiments/local-agent-probe/discover.test.mjs
