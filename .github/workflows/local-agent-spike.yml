name: Local agent and desktop spike checks
on:
  push:
    branches:
      - spike/local-agents-desktop
  workflow_dispatch:
jobs:
  local-agent-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read-only discovery tests
        run: node --test experiments/local-agent-probe/discover.test.mjs
      - name: Official Claude Agent SDK adapter tests (mocked; no API calls)
        run: node --test experiments/local-agent-probe/claude-sdk-adapter.test.mjs
      - name: Reliability policy regression tests (synthetic; not provider E2E)
        run: node --test experiments/desktop-spike/sync-policy.test.mjs
      - name: Safe local agent resume commands (mocked; never launch a terminal)
        run: node --test experiments/desktop-spike/agent-actions.test.mjs
      - name: Desktop main-process behavior tests (fake Electron; no provider traffic)
        run: node --test experiments/desktop-spike/main.test.mjs
      - name: Electron main and preload syntax
        run: |
          node --check experiments/desktop-spike/main.cjs
          node --check experiments/desktop-spike/preload.cjs
      - name: Desktop UI script syntax
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const html=fs.readFileSync('experiments/desktop-spike/index.html','utf8'); const script=html.match(/<script>([\s\S]*?)<\/script>/); if (!script) throw Error('Missing desktop UI script'); new Function(script[1]);"
      - name: Verify regression gate register and produce coverage report
        run: |
          node --test experiments/desktop-spike/regression-report.test.mjs
          node experiments/desktop-spike/regression-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-workspace-regression-coverage
          path: experiments/desktop-spike/regression-status.md
          if-no-files-found: warn
